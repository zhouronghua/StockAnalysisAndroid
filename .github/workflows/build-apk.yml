name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v3
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 更新包索引
      run: |
        sudo apt-get update -qq
    
    - name: 安装系统依赖
      run: |
        sudo apt-get install -y \
          git zip unzip openjdk-11-jdk wget curl \
          python3-pip autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          build-essential ccache autoconf-archive
    
    - name: 安装额外构建依赖
      run: |
        sudo apt-get install -y \
          libgdbm-dev libc6-dev libbz2-dev \
          libreadline-dev libsqlite3-dev \
          libltdl-dev gettext
    
    - name: 安装Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.36
    
    - name: 缓存Buildozer依赖
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
    
    - name: 构建APK
      env:
        BUILDOZER_WARN_ON_ROOT: 0
        USE_SDK_WRAPPER: 1
        P4A_RELEASE_TAG: "2024.01.21"
      run: |
        buildozer -v android debug
    
    - name: 检查构建结果
      if: always()
      run: |
        echo "=== 构建目录内容 ==="
        ls -lah bin/ || echo "bin目录不存在"
        echo "=== Buildozer日志 ==="
        if [ -f .buildozer/logs/buildozer.log ]; then
          tail -100 .buildozer/logs/buildozer.log
        fi
    
    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: stockanalysis-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: 创建Release（可选）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
